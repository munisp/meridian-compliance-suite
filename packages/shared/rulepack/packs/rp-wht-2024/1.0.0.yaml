id: rp-wht-2024
version: 1.0.0
effective_from: 2025-01-01
effective_to: null
status: published
subject_to_regazette: true
provenance:
  as_passed: "Deduction of Tax at Source (Withholding) Regulations 2024 — rates, timing, exemptions"
  as_gazetted: "Federal Republic of Nigeria Official Gazette, 2024"
  source_citation: "Deduction of Tax at Source (Withholding) Regulations 2024"
signed: { algorithm: ed25519, key_id: governance-board-2026, signature: "DEV-UNSIGNED" }
rules:
  # --- Timing: deduction at the EARLIER of payment or settlement (Reg. 3) ---
  - id: wht.trigger.payment_first
    when: { payment_date__exists: true, settlement_date__exists: true, payment_before_settlement: true }
    then: { deduction_trigger: payment, narrate: "Deduct at earlier of payment or settlement: payment occurred first (Reg 3(1))" }
  - id: wht.trigger.settlement_first
    when: { payment_date__exists: true, settlement_date__exists: true, payment_before_settlement: false }
    then: { deduction_trigger: settlement, narrate: "Deduct at earlier of payment or settlement: settlement occurred first (Reg 3(1))" }
  - id: wht.trigger.payment_only
    when: { payment_date__exists: true, settlement_date__exists: false }
    then: { deduction_trigger: payment, narrate: "Deduction triggered on payment (Reg 3(1))" }
  - id: wht.trigger.settlement_only
    when: { payment_date__exists: false, settlement_date__exists: true }
    then: { deduction_trigger: settlement, narrate: "Deduction triggered when amount is settled/recognised (Reg 3(1))" }
  # --- Base rates: companies vs individuals (First Schedule) ---
  - id: wht.rate.goods.company
    when: { payment_type: goods, beneficiary: company }
    then: { rate_bps: 200, narrate: "WHT 2% on goods supplied to companies" }
  - id: wht.rate.goods.individual
    when: { payment_type: goods, beneficiary: individual }
    then: { rate_bps: 500, narrate: "WHT 5% on goods supplied by individuals" }
  - id: wht.rate.services.company
    when: { payment_type: services, beneficiary: company }
    then: { rate_bps: 200, narrate: "WHT 2% on services for companies (2024 Regs reduced from 5%)" }
  - id: wht.rate.services.individual
    when: { payment_type: services, beneficiary: individual }
    then: { rate_bps: 500, narrate: "WHT 5% on services by individuals" }
  - id: wht.rate.contract.company
    when: { payment_type: contract, beneficiary: company }
    then: { rate_bps: 200, narrate: "WHT 2% on contracts (all aspects of building/construction/supply), companies" }
  - id: wht.rate.contract.individual
    when: { payment_type: contract, beneficiary: individual }
    then: { rate_bps: 500, narrate: "WHT 5% on contracts, individuals" }
  - id: wht.rate.dividend
    when: { payment_type: dividend }
    then: { rate_bps: 1000, narrate: "WHT 10% on dividends" }
  - id: wht.rate.interest
    when: { payment_type: interest }
    then: { rate_bps: 1000, narrate: "WHT 10% on interest" }
  - id: wht.rate.rent.company
    when: { payment_type: rent, beneficiary: company }
    then: { rate_bps: 1000, narrate: "WHT 10% on rent (companies)" }
  - id: wht.rate.rent.individual
    when: { payment_type: rent, beneficiary: individual }
    then: { rate_bps: 1000, narrate: "WHT 10% on rent (individuals)" }
  - id: wht.rate.royalty.company
    when: { payment_type: royalty, beneficiary: company }
    then: { rate_bps: 500, narrate: "WHT 5% on royalties (companies, 2024 Regs)" }
  - id: wht.rate.royalty.individual
    when: { payment_type: royalty, beneficiary: individual }
    then: { rate_bps: 1000, narrate: "WHT 10% on royalties (individuals)" }
  - id: wht.rate.commission.company
    when: { payment_type: commission, beneficiary: company }
    then: { rate_bps: 200, narrate: "WHT 2% on commission/consultancy/professional fees (companies)" }
  - id: wht.rate.commission.individual
    when: { payment_type: commission, beneficiary: individual }
    then: { rate_bps: 500, narrate: "WHT 5% on commission/consultancy/professional fees (individuals)" }
  # --- No-TIN double rate (Reg 8(2)) ---
  - id: wht.identity.nin_acceptable
    when: { beneficiary: individual, has_nin: true, has_tin: false }
    then: { identity_ok: true, narrate: "NIN acceptable in place of TIN for individuals (Reg 8(4))" }
  - id: wht.identity.tin_ok
    when: { has_tin: true }
    then: { identity_ok: true, narrate: "Valid TIN presented" }
  - id: wht.no_tin.double
    when: { has_tin: false, has_nin: false, identity_ok: false }
    then: { rate_multiplier: 2, violation: "Reg 8(2): rate doubled where recipient has no TIN (and no NIN for individuals)", severity: fatal }
  # --- Small company carve-out: <= N2m monthly to suppliers with valid TIN (Reg 5) ---
  - id: wht.smallco.exempt
    when: { monthly_amount_kobo__lte: 200000000, has_tin: true }
    then: { small_company_carveout: true, rate_bps: 0, narrate: "Reg 5: transactions <= N2,000,000/month with valid-TIN supplier exempt from deduction" }
  # --- Exemptions (Reg 4) ---
  - id: wht.exempt.direct_debit
    when: { via_direct_debit: true }
    then: { exempt: true, rate_bps: 0, narrate: "Reg 4: payment by direct debit from bank account of the payer is exempt from deduction" }
  - id: wht.exempt.broker
    when: { via_broker: true }
    then: { exempt: true, rate_bps: 0, narrate: "Reg 4: transactions through registered brokers/dealers exempt" }
  - id: wht.exempt.manufacturer_materials
    when: { payment_type: goods, supplier_is_manufacturer: true }
    then: { exempt: true, rate_bps: 0, narrate: "Reg 4: sale of goods by manufacturer/producer exempt" }
  - id: wht.exempt.imported
    when: { goods_imported: true }
    then: { exempt: true, rate_bps: 0, narrate: "Reg 4: imported goods where payment made via letter of credit etc." }
  # --- Remittance deadline ---
  - id: wht.remit.deadline.company
    when: { beneficiary: company }
    then: { remit_deadline_day: 21, narrate: "Remit to NRS by 21st day of the month following deduction (CITA)" }
  - id: wht.remit.deadline.individual
    when: { beneficiary: individual }
    then: { remit_deadline_day: 30, narrate: "Remit to State IRS by 30th day of the month following deduction (PITA)" }
