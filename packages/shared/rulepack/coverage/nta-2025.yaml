# Coverage matrix — Nigeria Tax Act 2025
statute:
  id: nta-2025
  title: Nigeria Tax Act 2025
  jurisdiction: NG-FED
  effective_from: '2026-01-01'
  gazette: Nigeria Tax Act 2025 (signed 26 June 2025; gazette CTC pending)
  subject_to_regazette: true

sections:
  - section_id: first-schedule.pit-bands
    title: PIT bands 0% to 25% (N800k ... N50m+)
    implementing_rules:
      - rp-education-ng:pit.band.1
      - rp-education-ng:pit.band.2
      - rp-education-ng:pit.band.3
      - rp-education-ng:pit.band.4
      - rp-education-ng:pit.band.5
      - rp-education-ng:pit.band.6
    conformance_tests: []
    status: IMPLEMENTED
    citation_kind: secondary

  - section_id: s.30.rent-relief
    title: Rent relief — 20% of rent paid, capped at N500,000
    implementing_rules:
      - rp-education-ng:pit.rent-relief
    conformance_tests: []
    status: IMPLEMENTED
    citation_kind: secondary

  - section_id: s.56.cit-small-company
    title: Small company (turnover <= N100m AND fixed assets <= N250m) — 0% CIT
    implementing_rules:
      - rp-education-ng:cit.small-company.zero
    conformance_tests: []
    status: IMPLEMENTED
    citation_kind: secondary

