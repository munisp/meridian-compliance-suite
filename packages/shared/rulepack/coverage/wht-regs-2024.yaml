# Coverage matrix — Deduction of Tax at Source (Withholding) Regulations 2024
# Source: tax-law-gaps findings #1-#9, #14-#16; gov-filing register §1.3.
statute:
  id: wht-regs-2024
  title: Deduction of Tax at Source (Withholding) Regulations 2024
  jurisdiction: NG-FED
  effective_from: '2025-01-01'        # regs in force 2025-01-01 (winnings rules 2024-10-01)
  gazette: Federal Republic of Nigeria Official Gazette No. 106, Vol. 111 of 2024 (awaiting CTC)
  subject_to_regazette: true

sections:
